<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enigma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --ink:#141414;
    --grey:#8E8E8E;
    --grey-soft:#C9C9C9;
    --orange:#C2470C;
    --item-h:76px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--white);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{width:100%;max-width:620px;text-align:center}

  h1{
    font-size:clamp(52px,13vw,86px);
    font-weight:700;
    letter-spacing:-.045em;
    line-height:1;
    margin-bottom:52px;
  }
  h1 span{color:var(--orange)}

  .reel{
    position:relative;
    height:calc(var(--item-h) * 5);
    overflow:hidden;
  }
  .reel::before,.reel::after{
    content:"";position:absolute;left:0;right:0;height:calc(var(--item-h) * 1.9);
    pointer-events:none;z-index:3;
  }
  .reel::before{top:0;background:linear-gradient(var(--white) 18%,rgba(255,255,255,0))}
  .reel::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),var(--white) 82%)}

  .strip{position:absolute;left:0;right:0;top:0;will-change:transform}

  .item{
    height:var(--item-h);
    display:flex;align-items:center;justify-content:center;
    padding:0 12px;
    font-size:19px;font-weight:500;line-height:1.3;
    color:var(--grey-soft);
    transition:color .3s ease;
  }
  .item i{font-style:normal;display:block;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
  .item.on{color:var(--grey)}

  .reel.done .item.on{color:var(--orange);font-weight:600}
  .reel.done .item.on i{transform:scale(1.28)}

  #spin{
    margin-top:44px;
    font-family:inherit;font-size:14px;font-weight:500;
    padding:16px 44px;border:none;border-radius:999px;
    background:var(--orange);color:var(--white);
    cursor:pointer;transition:.18s ease;
  }
  #spin:hover{background:#A63A08}
  #spin:disabled{background:var(--grey-soft);cursor:not-allowed}

  :focus-visible{outline:2px solid var(--orange);outline-offset:3px}

  @media (max-width:520px){
    :root{--item-h:66px}
    .item{font-size:17px}
    #spin{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Enigma<span>.</span></h1>

  <div class="reel" id="reel">
    <div class="strip" id="strip"></div>
  </div>

  <button id="spin">Lancer</button>

</div>

<script>
(function(){

  /* ============================================================
     TES SUJETS — une phrase par ligne, entre guillemets, virgule à la fin
     ============================================================ */
  const SUJETS = [
    "Qu'est-ce qu'un algorithme cherche vraiment à maximiser ?",
    "Pourquoi ton feed te montre toujours la même chose ?",
    "Qu'acceptes-tu vraiment en cochant les conditions ?",
    "Pourquoi le code par SMS est le pire des codes ?",
    "Pourquoi le prix d'un billet d'avion bouge sans arrêt ?",
    "Pourquoi vendre un produit avant de l'avoir fini ?",
    "Ton téléphone te distrait-il même retourné ?",
    "Pourquoi es-tu épuisé après une journée assis ?",
    "La caféine donne-t-elle vraiment de l'énergie ?",
    "Pourquoi les faits ne font-ils pas changer d'avis ?"
  ];
  /* ============================================================ */

  const REPEAT  = 10;
  const strip   = document.getElementById('strip');
  const reel    = document.getElementById('reel');
  const spinBtn = document.getElementById('spin');

  const list = SUJETS.filter(s => s && s.trim());
  let pos = 0;
  let spinning = false;

  const itemH = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-h'));

  function render(){
    strip.innerHTML = '';
    for(let r = 0; r < REPEAT; r++){
      list.forEach(txt => {
        const d = document.createElement('div');
        d.className = 'item';
        const i = document.createElement('i');
        i.textContent = txt;
        d.appendChild(i);
        strip.appendChild(d);
      });
    }
    apply();
  }

  function apply(blur){
    strip.style.transform = 'translateY(' + (-pos * itemH()) + 'px)';
    strip.style.filter = blur ? 'blur(' + blur.toFixed(1) + 'px)' : 'none';
    const idx = Math.round(pos) + 2;
    strip.querySelectorAll('.item.on').forEach(e => e.classList.remove('on'));
    const el = strip.children[idx];
    if(el) el.classList.add('on');
  }

  function spin(){
    if(spinning || !list.length) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const target = Math.floor(Math.random() * list.length);

    reel.classList.remove('done');

    if(list.length === 1 || reduced){
      pos = target; apply(); reel.classList.add('done'); return;
    }

    spinning = true;
    spinBtn.disabled = true;

    const start = pos;
    const laps = list.length * (4 + Math.floor(Math.random() * 2));
    let end = start + laps;
    end = end - ((end % list.length) - target);
    if(end <= start) end += list.length;

    const dur = 3400;
    const t0 = performance.now();

    function frame(t){
      const p = Math.min((t - t0) / dur, 1);
      const e = 1 - Math.pow(1 - p, 4);
      pos = start + (end - start) * e;
      const speed = (end - start) * 4 * Math.pow(1 - p, 3) / dur * 16;
      apply(Math.min(3.5, speed * 0.5));
      if(p < 1) requestAnimationFrame(frame);
      else{
        pos = end % list.length;
        apply();
        spinning = false;
        spinBtn.disabled = false;
        reel.classList.add('done');
      }
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener('click', spin);
  document.addEventListener('keydown', e => {
    if(e.code === 'Space' && e.target === document.body){ e.preventDefault(); spin(); }
  });

  window.addEventListener('resize', () => apply());
  render();
})();
</script>
</body>
</html>
